services:
  postgres:
    image: postgres:16-alpine
    container_name: sportreplay-postgres
    environment:
      POSTGRES_DB: sportreplay
      POSTGRES_USER: sportreplay
      POSTGRES_PASSWORD: sportreplay_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportreplay -d sportreplay"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sportreplay-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/sportreplay-videos;
      exit 0;
      "

  redis:
    image: redis:7-alpine
    container_name: sportreplay-redis
    ports:
      - "6379:6379"
    profiles: ["optional"]

  backend:
    build:
      context: .
      dockerfile: src/backend/SportReplay.Api/Dockerfile
    container_name: sportreplay-backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_CONNECTION_STRING: Host=postgres;Port=5432;Database=sportreplay;Username=sportreplay;Password=sportreplay_dev
      JWT_SECRET: sportreplay-dev-jwt-secret-key-change-me-32
      JWT_ISSUER: SportReplay
      JWT_AUDIENCE: SportReplay
      STORAGE_ENDPOINT: minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: sportreplay-videos
      VIDEO_RETENTION_DAYS: 7
      MAX_CLIP_DURATION_SECONDS: 60
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_API_VERSION: v21.0
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:8080
    ports:
      - "5080:8080"

  frontend:
    build:
      context: ./src/frontend/sport-replay-web
      dockerfile: Dockerfile
    container_name: sportreplay-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  minio_data:
